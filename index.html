<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>שעון עברי</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Hebrew:wght@300;400&display=swap" rel="stylesheet">
<style>
@font-face { font-family: 'NSH'; src: url('NotoSerifHebrew.woff2') format('woff2'); font-display: swap; }
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { width: 100%; height: 100%; overflow: hidden; }
body {
  background: #f5f0e8; color: #1a1a1a; border: 6px solid #1a1a1a;
  font-family: 'NSH', 'Noto Serif Hebrew', 'David Libre', 'FrankRuehl', 'Times New Roman', serif;
  user-select: none; -webkit-user-select: none; position: relative;
}
body.night { background: #111; border-color: #2a2a2a; color: #9a9a9a; }
.v { position: absolute; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; }
.v.on { display: flex; }
#clock { width: 88%; text-align: center; line-height: 1.8; font-size: clamp(2.2rem, 7.5vw, 5rem); transition: opacity .55s ease-in-out; }
#clock.fade { opacity: 0; }
#date { margin-top: 1.2rem; font-size: clamp(1.1rem, 3.5vw, 2rem); color: #6b6459; }
body.night #date { color: #666; }
#cal { width: 92%; height: 94%; overflow: hidden; display: flex; flex-direction: column; gap: .7rem; justify-content: flex-start; padding-top: .4rem; }
.day { background: rgba(0,0,0,.045); border-radius: 14px; padding: .6rem 1rem; }
body.night .day { background: rgba(255,255,255,.06); }
.day h3 { display: flex; justify-content: space-between; font-weight: 400; font-size: clamp(1rem, 3.2vw, 1.5rem); color: #6b6459; margin-bottom: .3rem; }
.ev { display: grid; grid-template-columns: 5.4em 1fr; align-items: baseline; font-size: clamp(1.1rem, 4.2vw, 1.9rem); line-height: 1.45; padding: .2rem 0; }
.ev + .ev { border-top: 1px solid rgba(128,128,128,.25); }
.ev .t { color: #6b6459; }
.ev.now .t, .ev.now { font-weight: 700; color: inherit; }
.m { text-align: center; color: #6b6459; font-size: 1.4rem; margin: auto; }
@media (orientation: landscape) { #cal { flex-direction: row; flex-wrap: wrap; align-content: flex-start; } .day { flex: 1 1 30%; } }
#gal { background: #000; }
#pic { max-width: 100%; max-height: 100%; object-fit: contain; transition: opacity .6s; }
#msg { position: absolute; color: #bbb; font-size: 1.4rem; text-align: center; padding: 1rem; }
</style>
</head>
<body>

<div class="v on" id="v0"><div id="clock"></div><div id="date"></div></div>
<div class="v" id="v1"><div id="cal"></div></div>
<div class="v" id="gal">
  <img id="pic" alt="">
  <div id="msg"></div>
</div>

<script>
const $ = id => document.getElementById(id);

// ── Wake lock ──
let wl = null;
async function lock() { try { if ('wakeLock' in navigator) wl = await navigator.wakeLock.request('screen'); } catch (e) {} }
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') lock(); });
lock();

// ── Night mode (21:00–06:00) ──
function night() { const h = new Date().getHours(); document.body.classList.toggle('night', h >= 21 || h < 6); }
setInterval(night, 60000); night();

// ── Hebrew time ──
const H = ['','אַחַת','שְׁתַּיִם','שָׁלוֹשׁ','אַרְבַּע','חָמֵשׁ','שֵׁשׁ','שֶׁבַע','שְׁמוֹנֶה','תֵּשַׁע','עֶשֶׂר','אַחַת עֶשְׂרֵה','שְׁתֵּים עֶשְׂרֵה'];
const HL = ['','לְאַחַת','לִשְׁתַּיִם','לְשָׁלוֹשׁ','לְאַרְבַּע','לְחָמֵשׁ','לְשֵׁשׁ','לְשֶׁבַע','לִשְׁמוֹנֶה','לְתֵשַׁע','לְעֶשֶׂר','לְאַחַת עֶשְׂרֵה','לִשְׁתֵּים עֶשְׂרֵה'];
const U = ['','אַחַת','שְׁתַּיִם','שָׁלוֹשׁ','אַרְבַּע','חָמֵשׁ','שֵׁשׁ','שֶׁבַע','שְׁמוֹנֶה','תֵּשַׁע'];

function pod(h) {
  if (h <= 4) return 'בַּלַּיְלָה';
  if (h === 5) return 'לִפְנוֹת בּוֹקֶר';
  if (h <= 11) return 'בַּבֹּקֶר';
  if (h <= 13) return 'בַּצָּהֳרַיִם';
  if (h <= 16) return 'אַחַר הַצָּהֳרַיִם';
  if (h <= 20) return 'בָּעֶרֶב';
  return 'בַּלַּיְלָה';
}

function mp(m) {
  if (m === 0) return null;
  const TO = { 35: 'עֶשְׂרִים וַחֲמִשָּׁה', 40: 'עֶשְׂרִים', 45: 'רֶבַע', 50: 'עֲשָׂרָה', 55: 'חֲמִשָּׁה', 59: 'דַּקָּה' };
  if (TO[m]) return { t: TO[m], to: true };
  const F = { 1: 'וְדַקָּה', 2: 'וּשְׁתֵּי דַּקּוֹת', 5: 'וַחֲמִשָּׁה', 10: 'וַעֲשָׂרָה', 15: 'וָרֶבַע', 20: 'וְעֶשְׂרִים', 30: 'וָחֵצִי',
    11: 'וְאַחַת עֶשְׂרֵה דַּקּוֹת', 12: 'וּשְׁתֵּים עֶשְׂרֵה דַּקּוֹת', 13: 'וּשְׁלוֹשׁ עֶשְׂרֵה דַּקּוֹת',
    14: 'וְאַרְבַּע עֶשְׂרֵה דַּקּוֹת', 16: 'וְשֵׁשׁ עֶשְׂרֵה דַּקּוֹת', 17: 'וְשֶׁבַע עֶשְׂרֵה דַּקּוֹת',
    18: 'וּשְׁמוֹנֶה עֶשְׂרֵה דַּקּוֹת', 19: 'וְתֵשַׁע עֶשְׂרֵה דַּקּוֹת' };
  if (F[m]) return { t: F[m] };
  if (m >= 3 && m <= 9) return { t: 'וְ' + U[m] + ' דַּקּוֹת' };
  const tens = { 2: 'עֶשְׂרִים', 3: 'שְׁלוֹשִׁים', 4: 'אַרְבָּעִים', 5: 'חֲמִשִּׁים' }[Math.floor(m / 10)];
  const u = m % 10;
  return { t: tens + (u ? ' וְ' + U[u] : '') };
}

// no dagesh in ת after וְ / לְ
const fix = s => s.replace(/([ול]\u05B0)\u05EA([\u05B0-\u05BB]*)\u05BC/g, '$1ת$2');

function timeStr(h, m) {
  if (h === 0 && m === 0) return 'חֲצוֹת';
  if (h === 12 && m === 0) return 'צָהֳרַיִם';
  const h12 = h % 12 || 12, p = pod(h), ph = mp(m);
  if (!ph) return fix(H[h12] + ' ' + p);
  if (ph.to) { const nh = (h + 1) % 24; return fix(ph.t + ' ' + HL[nh % 12 || 12] + ' ' + pod(nh)); }
  return fix(H[h12] + ' ' + ph.t + ' ' + p);
}

// ── Clock + date ──
const clockEl = $('clock'), dateEl = $('date');
let last = '';
function setDate() { dateEl.textContent = new Date().toLocaleDateString('he-IL', { day: 'numeric', month: 'long', year: 'numeric' }); }
function tick() {
  const n = new Date(), s = timeStr(n.getHours(), n.getMinutes());
  if (s === last) return;
  const first = last === '';
  last = s;
  if (first) { clockEl.textContent = s; setDate(); return; }
  clockEl.classList.add('fade');
  setTimeout(() => { clockEl.textContent = s; setDate(); clockEl.classList.remove('fade'); }, 570);
  // nightly refresh at 03:00, once per day
  const key = n.toDateString();
  if (n.getHours() === 3 && localStorage.getItem('rl') !== key) { localStorage.setItem('rl', key); location.reload(); }
}
tick(); setInterval(tick, 1000);

// ── Views: tap cycles clock → calendar → gallery ──
let view = 0, idle, galTimer;
function go(i) {
  view = i;
  ['v0', 'v1', 'gal'].forEach((id, k) => $(id).classList.toggle('on', k === i));
  clearTimeout(idle); clearInterval(galTimer);
  if (i === 1) loadCal();
  if (i === 2) startGal();
  if (i) idle = setTimeout(() => go(0), i === 1 ? 180000 : 600000);
}
document.addEventListener('click', e => { if (!e.target.closest('button')) go((view + 1) % 3); });

// ── Calendar + photos: one Google Apps Script URL, kept only in this device's storage ──
const qp = new URLSearchParams(location.search);
['cal', 'sec'].forEach(k => { const v = qp.get(k); if (v) localStorage.setItem(k, v); });
const SEC = +localStorage.getItem('sec') || 15;
const CAL = () => localStorage.getItem('cal');

function el(tag, cls, txt) { const e = document.createElement(tag); if (cls) e.className = cls; if (txt) e.textContent = txt; return e; }
async function data() { const r = await (await fetch(CAL())).json(); return Array.isArray(r) ? { events: r, photos: [] } : r; }
const hm = d => d.toLocaleTimeString('he-IL', { hour: '2-digit', minute: '2-digit' });

async function loadCal() {
  const box = $('cal');
  box.replaceChildren();
  if (!CAL()) { box.append(el('p', 'm', 'היומן עדיין לא הוגדר')); return; }
  try {
    const now = Date.now(), today = new Date().toDateString(), tom = new Date(now + 864e5).toDateString();
    const ev = (await data()).events.filter(e => e.a || (e.e || e.s) > now).sort((a, b) => a.s - b.s).slice(0, 12);
    if (!ev.length) { box.append(el('p', 'm', 'אין אירועים בימים הקרובים')); return; }
    let day = '', card;
    for (const e of ev) {
      const d = new Date(e.s), k = d.toDateString();
      if (k !== day) {
        day = k; card = el('div', 'day');
        const h = el('h3');
        h.append(el('span', '', k === today ? 'היום' : k === tom ? 'מחר' : d.toLocaleDateString('he-IL', { weekday: 'long' })),
                 el('span', '', d.toLocaleDateString('he-IL', { day: 'numeric', month: 'long' })));
        card.append(h); box.append(card);
      }
      const row = el('div', 'ev' + (!e.a && e.s <= now ? ' now' : ''));
      row.append(el('span', 't', e.a ? 'כל היום' : hm(d)), el('span', '', e.t));
      card.append(row);
    }
  } catch (err) { box.replaceChildren(el('p', 'm', 'לא ניתן לטעון את היומן')); }
}

// ── Photos cached on the device (IndexedDB), synced from the Drive folder ──
const db = () => new Promise((res, rej) => {
  const r = indexedDB.open('kiosk', 2);
  r.onupgradeneeded = () => {
    const d = r.result;
    if (d.objectStoreNames.contains('p')) d.deleteObjectStore('p');
    if (!d.objectStoreNames.contains('ph')) d.createObjectStore('ph', { keyPath: 'id' });
  };
  r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
});
const tx = async m => (await db()).transaction('ph', m);
async function allPics() { const t = await tx('readonly'); return new Promise(r => { const g = t.objectStore('ph').getAll(); g.onsuccess = () => r(g.result); g.onerror = () => r([]); }); }
async function putPic(o) { const t = await tx('readwrite'); t.objectStore('ph').put(o); return new Promise(r => t.oncomplete = r); }
async function delPic(id) { const t = await tx('readwrite'); t.objectStore('ph').delete(id); return new Promise(r => t.oncomplete = r); }

async function shrink(blob) {
  let bmp;
  try { bmp = await createImageBitmap(blob, { resizeWidth: 1280, resizeQuality: 'medium' }); }
  catch (e) {
    bmp = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error('פענוח התמונה נכשל')); i.src = URL.createObjectURL(blob); });
  }
  const k = Math.min(1, 1280 / Math.max(bmp.width, bmp.height));
  const c = document.createElement('canvas'); c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
  c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
  return new Promise(r => c.toBlob(r, 'image/jpeg', 0.82));
}

let syncing = false, status = '', lastErr = '';
async function sync() {
  const u = CAL();
  if (syncing || !u) return;
  syncing = true; status = ''; lastErr = '';
  try {
    const list = (await data()).photos || [], have = await allPics();
    const ids = new Set(list.map(p => p.id)), ver = new Map(have.map(h => [h.id, h.u]));
    for (const h of have) if (!ids.has(h.id)) await delPic(h.id);
    let n = 0;
    for (const p of list) {
      n++;
      if (ver.get(p.id) === p.u) continue;
      status = 'טוען תמונה ' + n + ' מתוך ' + list.length + '...';
      if (view === 2 && !pics.length) $('msg').textContent = status;
      try {
        const full = u + (u.includes('?') ? '&' : '?') + 'img=' + p.id;
        const t = await (await fetch(full)).text();
        let r = {}; try { r = JSON.parse(t); } catch (x) {}
        if (!r.d) throw new Error('אין תמונה בתשובה. כתובת: ...' + full.slice(-60) + ' | תשובה: ' + t.slice(0, 100));
        await putPic({ id: p.id, u: p.u, b: await shrink(await (await fetch(r.d)).blob()) });
      } catch (e) { lastErr = e.message || String(e); }
    }
  } catch (e) { lastErr = e.message || String(e); }
  syncing = false;
}
sync(); setInterval(sync, 30 * 60000);

// ── Gallery ──
let pics = [], idx = 0, url = '';
async function startGal(noSync) {
  pics = (await allPics()).map(p => p.b).sort(() => Math.random() - .5);
  const pic = $('pic'), msg = $('msg');
  pic.style.display = pics.length ? '' : 'none';
  msg.textContent = pics.length ? '' : !CAL() ? 'היומן והתמונות עדיין לא הוגדרו' : syncing ? (status || 'טוען תמונות מהתיקייה...') : lastErr ? 'לא ניתן לטעון תמונות: ' + lastErr : 'אין תמונות. הוסף תמונות לתיקייה Kiosk בדרייב';
  if (!pics.length) {
    if (!noSync) sync().then(() => { if (view === 2) startGal(true); });
    return;
  }
  idx = 0;
  const show = () => {
    pic.style.opacity = 0;
    setTimeout(() => { if (url) URL.revokeObjectURL(url); url = URL.createObjectURL(pics[idx]); pic.src = url; pic.style.opacity = 1; idx = (idx + 1) % pics.length; }, 600);
  };
  show(); galTimer = setInterval(show, SEC * 1000);
}
</script>
</body>
</html>
